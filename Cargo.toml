[workspace]
resolver = "3"
members = ["crates/thatsit-core", "crates/thatsit-app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/federicosimoni/thats-it"
authors = ["Federico Simoni"]
rust-version = "1.85"

[workspace.dependencies]
thatsit-core = { path = "crates/thatsit-core", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
