[package]
name = "thatsit-core"
description = "Platform-independent core of That's it (conversions, geometry, pipeline)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
img-parts = "0.4"
oxipng = { version = "10.2", default-features = false, features = ["parallel"], optional = true }
resvg = "0.49"
fluent-bundle = "0.16"
fluent-langneg = "0.13"
fluent-syntax = "0.12"
unic-langid = "0.9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[features]
default = ["optimize-png"]
# builtin:optimize-png (oxipng builds a C library; disable to cross-check from Linux).
optimize-png = ["dep:oxipng"]

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
