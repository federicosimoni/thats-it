[package]
name = "thatsit-app"
description = "That's it — drag & drop file converter for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "thatsit"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
thatsit-core.workspace = true
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
objc2-pdf-kit = "0.3.2"
objc2-user-notifications = "0.3.2"
dispatch2 = "0.3.1"
objc2-service-management = "0.3.2"
block2 = "0.6.2"

[features]
default = ["optimize-png"]
optimize-png = ["thatsit-core/optimize-png"]

[lints]
workspace = true
