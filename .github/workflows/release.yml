name: Release

# Pushing a tag like v0.1.0 builds the universal app, creates a GitHub Release with the
# .dmg and, if the HOMEBREW_TAP_TOKEN secret exists, updates federicosimoni/homebrew-tap.
# It can also be started by hand (Actions → Release → Run workflow) on main: it then
# creates the tag v<version from Cargo.toml> on the commit it runs on.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Check the tag matches the crate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            test "v$VERSION" = "$TAG" || { echo "::error::tag $TAG but Cargo.toml says $VERSION"; exit 1; }
          else
            TAG=v$VERSION
            test "$GITHUB_REF_NAME" = main || { echo "::error::run the release from main"; exit 1; }
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::release $TAG already exists; bump the version first"; exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      - name: Import the Developer ID certificate and notary key (if configured)
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "::notice::No Developer ID secrets: the app is signed ad hoc (not notarized)"
            echo "NOTARIZED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "THATSIT_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY" ]; then
            echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            {
              echo "THATSIT_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
              echo "THATSIT_NOTARY_KEY_ID=$NOTARY_KEY_ID"
              echo "THATSIT_NOTARY_ISSUER=$NOTARY_ISSUER"
              echo "NOTARIZED=1"
            } >> "$GITHUB_ENV"
          else
            echo "NOTARIZED=0" >> "$GITHUB_ENV"
          fi
      - name: Build the universal app and dmg
        run: cargo xtask dmg
      - name: Checksum
        run: |
          cd target/bundle
          shasum -a 256 "Thats-it-$VERSION.dmg" | tee "Thats-it-$VERSION.dmg.sha256"
          echo "SHA256=$(cut -d' ' -f1 "Thats-it-$VERSION.dmg.sha256")" >> "$GITHUB_ENV"
      - name: Create the tag (manual runs)
        if: github.ref_type != 'tag'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$NOTARIZED" = 1 ]; then
            GATEKEEPER="Signed with a Developer ID and notarized by Apple."
          else
            GATEKEEPER="That's it is not notarized by Apple yet, so macOS blocks the first launch: open
          **System Settings → Privacy & Security** and click **Open Anyway** (or run
          \`xattr -dr com.apple.quarantine \"/Applications/That's it.app\"\`)."
          fi
          cat > notes.md <<NOTES
          ## Install

          - **Homebrew:** \`brew install --cask federicosimoni/tap/thats-it\`
          - **Manually:** open the .dmg and drag *That's it* to Applications.

          $GATEKEEPER

          Universal binary (Apple silicon + Intel), macOS 13 Ventura or later.
          Video and MP3 conversions need \`brew install ffmpeg\`.

          SHA-256: \`$SHA256\`
          NOTES
          gh release create "$TAG" --verify-tag \
            "target/bundle/Thats-it-$VERSION.dmg" \
            "target/bundle/Thats-it-$VERSION.dmg.sha256" \
            --title "That's it $VERSION" --notes-file notes.md
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set; skipping the tap update"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/federicosimoni/homebrew-tap.git" tap
          mkdir -p tap/Casks
          CASK=packaging/homebrew/thats-it.rb
          if [ "$NOTARIZED" = 1 ]; then
            # Drop the Gatekeeper caveat (between the NOT-NOTARIZED markers).
            sed '/# NOT-NOTARIZED-BEGIN/,/# NOT-NOTARIZED-END/d' "$CASK" > cask.rb
          else
            grep -v 'NOT-NOTARIZED-' "$CASK" > cask.rb
          fi
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" cask.rb \
            | grep -v '^# ' > tap/Casks/thats-it.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/thats-it.rb
          git commit -m "thats-it $VERSION"
          git push
