name: Labels

# Creates or updates the labels listed in .github/labels.yml (never deletes any).

on:
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed=0
          while read -r label; do
            name=$(jq -r .name <<<"$label")
            color=$(jq -r .color <<<"$label")
            echo "label: $name ($color)"
            gh label create "$name" --color "$color" \
              --description "$(jq -r .description <<<"$label")" \
              --force --repo "$GITHUB_REPOSITORY" || failed=1
          done < <(yq -o=json '.' .github/labels.yml | jq -c '.[]')
          exit $failed
