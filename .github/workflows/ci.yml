name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Run every bundled conversion with the real macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || echo "::warning::ffmpeg not installed; ffmpeg conversions will be skipped"
          cargo test -p thatsit-core --test run_bundled -- --nocapture

  app-macos:
    name: App (macOS build + smoke test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (x86_64)
        run: cargo clippy -p thatsit-app --target x86_64-apple-darwin -- -D warnings
      - name: Build (arm64 + x86_64)
        run: |
          cargo build -p thatsit-app --target aarch64-apple-darwin
          cargo build -p thatsit-app --target x86_64-apple-darwin
      - name: Smoke test — launch, check the window, quit
        run: |
          ./target/aarch64-apple-darwin/debug/thatsit > thatsit.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::the app exited early"; cat thatsit.log; exit 1
          fi
          swift scripts/ci-list-windows.swift thatsit || { cat thatsit.log; kill "$PID"; exit 1; }
          screencapture -x screenshot.png || true
          kill "$PID"
          echo "--- app log ---"; cat thatsit.log
      - name: Visual self-test — ring opened on a HEIC photo (light and dark)
        run: |
          # A few extra user conversions so the ring shows a realistic number of sectors.
          DIR="$HOME/Library/Application Support/io.github.federicosimoni.thatsit/conversions"
          mkdir -p "$DIR"
          i=0
          for spec in "png|photo|Convert to PNG" "pdf|doc|Convert to PDF" "half|arrow.down.right.and.arrow.up.left|Resize 50%" "strip|location.slash|Strip metadata"; do
            IFS='|' read -r name icon label <<< "$spec"
            printf 'schema = 1\nid = "demo.%s"\ncategory = "images"\nicon = "%s"\naccepts = ["public.image"]\noutput_ext = "out"\nlabel.en = "%s"\n[[steps]]\ncmd = ["/usr/bin/true", "{output}"]\n' \
              "$name" "$icon" "$label" > "$DIR/demo-$i.toml"
            i=$((i+1))
          done
          capture() {
            THATSIT_DEMO=IMG_0423.heic ./target/aarch64-apple-darwin/debug/thatsit > "demo-$1.log" 2>&1 &
            PID=$!
            sleep 4
            RECT=$(swift scripts/ci-list-windows.swift thatsit | sed -n 's/^RECT //p' | head -1)
            echo "capture rect: $RECT"
            screencapture -x -R"$RECT" "ring-$1.png" || true
            kill "$PID" || true
            cat "demo-$1.log"
            if [ -f "ring-$1.png" ]; then
              sips -s format jpeg -s formatOptions 70 "ring-$1.png" --out "ring-$1.jpg" > /dev/null
              echo "BEGIN-RING-$1"; base64 -i "ring-$1.jpg" | fold -w 2000; echo "END-RING-$1"
            fi
          }
          capture light
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || true
          sleep 2
          capture dark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            thatsit.log
            screenshot.png
            demo-*.log
            ring-*.png
          if-no-files-found: ignore
