name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Locale consistency (warns on missing translations)
        run: cargo test -p thatsit-core --test locales -- --nocapture
      - name: Run every bundled conversion with the real macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg || echo "::warning::ffmpeg not installed; ffmpeg conversions will be skipped"
          cargo test -p thatsit-core --test run_bundled -- --nocapture

  app-macos:
    name: App (macOS build + smoke test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (x86_64)
        run: cargo clippy -p thatsit-app --target x86_64-apple-darwin -- -D warnings
      - name: Build (arm64 + x86_64)
        run: |
          cargo build -p thatsit-app --target aarch64-apple-darwin
          cargo build -p thatsit-app --target x86_64-apple-darwin
      - name: Smoke test — launch, check the window, quit
        run: |
          ./target/aarch64-apple-darwin/debug/thatsit > thatsit.log 2>&1 &
          PID=$!
          sleep 5
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::the app exited early"; cat thatsit.log; exit 1
          fi
          swift scripts/ci-list-windows.swift thatsit || { cat thatsit.log; kill "$PID"; exit 1; }
          screencapture -x screenshot.png || true
          kill "$PID"
          echo "--- app log ---"; cat thatsit.log
      - name: App engines — documents to PDF and PDF pages to PNG
        run: |
          BIN=./target/aarch64-apple-darwin/debug/thatsit
          mkdir -p e2e && cd e2e
          printf 'Hello from That'"'"'s it.\n\nA second paragraph.\n' > note.txt
          printf '<html><body><h1>Title</h1><p>Body text.</p></body></html>' > page.html
          printf '# Heading\n\nSome *Markdown*.\n' > readme.md
          textutil -convert docx -output letter.docx note.txt
          ../$BIN --convert document.to-pdf note.txt page.html letter.docx
          ../$BIN --convert document.markdown-to-pdf readme.md
          ../$BIN --convert document.pdf-to-png note.pdf
          ls -la . note
          test -s note.pdf && test -s page.pdf && test -s letter.pdf && test -s readme.pdf
          test -s note/note-001.png
          file note/note-001.png
          mdls -name kMDItemNumberOfPages note.pdf readme.pdf || true
      - name: Visual self-test — ring opened on a HEIC photo (light and dark)
        run: |
          # A few extra user conversions so the ring shows a realistic number of sectors.
          DIR="$HOME/Library/Application Support/io.github.federicosimoni.thatsit/conversions"
          mkdir -p "$DIR"
          i=0
          for spec in "png|photo|Convert to PNG" "pdf|doc|Convert to PDF" "half|arrow.down.right.and.arrow.up.left|Resize 50%" "strip|location.slash|Strip metadata"; do
            IFS='|' read -r name icon label <<< "$spec"
            printf 'schema = 1\nid = "demo.%s"\ncategory = "images"\nicon = "%s"\naccepts = ["public.image"]\noutput_ext = "out"\nlabel.en = "%s"\n[[steps]]\ncmd = ["/usr/bin/true", "{output}"]\n' \
              "$name" "$icon" "$label" > "$DIR/demo-$i.toml"
            i=$((i+1))
          done
          capture() {
            THATSIT_DEMO=IMG_0423.heic ./target/aarch64-apple-darwin/debug/thatsit > "demo-$1.log" 2>&1 &
            PID=$!
            sleep 4
            RECT=$(swift scripts/ci-list-windows.swift thatsit | sed -n 's/^RECT //p' | head -1)
            echo "capture rect: $RECT"
            screencapture -x -R"$RECT" "ring-$1.png" || true
            kill "$PID" || true
            cat "demo-$1.log"
            if [ -f "ring-$1.png" ]; then
              sips -s format jpeg -s formatOptions 70 "ring-$1.png" --out "ring-$1.jpg" > /dev/null
              echo "BEGIN-RING-$1"; base64 -i "ring-$1.jpg" | fold -w 2000; echo "END-RING-$1"
            fi
          }
          capture light
          # Preferences window (normal window layer 0), light mode.
          THATSIT_DEMO_PREFS=1 ./target/aarch64-apple-darwin/debug/thatsit > demo-prefs.log 2>&1 &
          PID=$!
          sleep 4
          RECT=$(swift scripts/ci-list-windows.swift thatsit 0 | sed -n 's/^RECT //p' | head -1)
          screencapture -x -R"$RECT" prefs.png || true
          kill "$PID" || true
          cat demo-prefs.log
          if [ -f prefs.png ]; then
            sips -s format jpeg -s formatOptions 60 prefs.png --out prefs.jpg > /dev/null
            echo "BEGIN-PREFS"; base64 -i prefs.jpg | fold -w 2000; echo "END-PREFS"
          fi
          osascript -e 'tell application "System Events" to tell appearance preferences to set dark mode to true' || true
          sleep 2
          capture dark
      - name: Bundle the universal app (ad-hoc signed) and dmg
        run: |
          cargo xtask dmg
          APP="target/bundle/That's it.app"
          lipo -info "$APP/Contents/MacOS/thatsit" | grep -q "x86_64 arm64\|arm64 x86_64"
          plutil -p "$APP/Contents/Info.plist"
          ls "$APP/Contents/Resources" "$APP/Contents/Resources/conversions" | head -50
          # The bundled app must find its own Resources/conversions.
          sips -s format jpeg e2e/note/note-001.png --out bundle-test.jpg > /dev/null
          "$APP/Contents/MacOS/thatsit" --convert image.to-png bundle-test.jpg 2>&1 | tee bundle.log
          grep -q "Contents/Resources/conversions" bundle.log
          test -s bundle-test.png
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: target/bundle/*.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            thatsit.log
            screenshot.png
            demo-*.log
            ring-*.png
            prefs.png
          if-no-files-found: ignore
