<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- That's it app icon: glass disc with a tray-and-arrow glyph (original artwork). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#D3DDE8"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#F1F4F8" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Squircle on the macOS icon grid (824 pt body, 100 pt margin). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#000000" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Glass disc. -->
  <circle cx="512" cy="512" r="282" fill="url(#disc)" filter="url(#shadow)"/>
  <circle cx="512" cy="512" r="282" fill="none" stroke="#000000" stroke-opacity="0.07" stroke-width="2"/>
  <!-- Tray with a down arrow. -->
  <g fill="none" stroke="#3A3A3C" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 330 V548"/>
    <path d="M424 462 L512 550 L600 462"/>
    <path d="M362 566 V626 Q362 676 412 676 H612 Q662 676 662 626 V566"/>
  </g>
</svg>
