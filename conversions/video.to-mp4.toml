# Video → MP4 (H.264 + AAC, web-friendly). Needs ffmpeg: `brew install ffmpeg`.
schema     = 1
id         = "video.to-mp4"
category   = "audio-video"
icon       = "film"
accepts    = ["public.movie"]
accepts_ext = ["mov", "mp4", "m4v", "avi", "mkv", "webm"]
output_ext = "mp4"
requires   = ["ffmpeg"]

[label]
en = "Convert to MP4"
it = "Converti in MP4"

[[steps]]
cmd = ["ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-i", "{input}", "-c:v", "libx264", "-crf", "20", "-preset", "medium", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "160k", "-movflags", "+faststart", "{output}"]
timeout_secs = 7200
