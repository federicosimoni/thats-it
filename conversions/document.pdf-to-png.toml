# PDF → one PNG per page (144 dpi) in a folder, rendered by PDFKit.
schema     = 1
id         = "document.pdf-to-png"
category   = "documents"
icon       = "doc.on.doc"
accepts    = ["com.adobe.pdf"]
accepts_ext = ["pdf"]
output_kind = "directory"

[label]
en = "Pages to PNG"
it = "Pagine in PNG"

[[steps]]
engine = "builtin:pdf-to-images"
args = { dpi = "{dpi}" }
timeout_secs = 1800

[[variants]]
id    = "screen"
label = { en = "Screen (72 dpi)", it = "Schermo (72 dpi)" }
vars  = { dpi = 72 }

[[variants]]
id      = "standard"
default = true
label   = { en = "Standard (144 dpi)", it = "Standard (144 dpi)" }
vars    = { dpi = 144 }

[[variants]]
id    = "print"
label = { en = "Print (300 dpi)", it = "Stampa (300 dpi)" }
vars  = { dpi = 300 }
