# Resize to 50% (same format), with the pure-Rust image engine.
schema     = 1
id         = "image.resize-50"
category   = "images"
icon       = "arrow.down.right.and.arrow.up.left"
accepts    = [
  "public.png",
  "public.jpeg",
  "public.tiff",
  "com.microsoft.bmp",
  "com.compuserve.gif",
  "org.webmproject.webp",
]
accepts_ext = ["png", "jpg", "jpeg", "tif", "tiff", "bmp", "gif", "webp"]
output_ext = "same"
output_suffix = " {percent}%"

[label]
en = "Resize by %"
it = "Riduci in %"

[[steps]]
engine = "builtin:image"
args = { scale = "{scale}" }

# The id keeps its historical name so that Preferences settings survive.
[[variants]]
id    = "25"
label = { en = "25%", it = "25%" }
vars  = { scale = 0.25, percent = 25 }

[[variants]]
id      = "50"
default = true
label   = { en = "50%", it = "50%" }
vars    = { scale = 0.5, percent = 50 }

[[variants]]
id    = "75"
label = { en = "75%", it = "75%" }
vars  = { scale = 0.75, percent = 75 }
