# Smaller video: H.264 CRF 28, at most 1920 px wide. Needs ffmpeg: `brew install ffmpeg`.
schema     = 1
id         = "video.compress"
category   = "audio-video"
icon       = "film"
accepts    = ["public.movie"]
accepts_ext = ["mov", "mp4", "m4v", "avi", "mkv", "webm"]
output_ext = "mp4"
output_suffix = " compressed"
requires   = ["ffmpeg"]

[label]
en = "Compress video"
it = "Comprimi video"

[[steps]]
cmd = ["ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error", "-i", "{input}", "-vf", "scale='min(1920,iw)':-2", "-c:v", "libx264", "-crf", "{crf}", "-preset", "medium", "-pix_fmt", "yuv420p", "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart", "{output}"]
timeout_secs = 7200

# Higher CRF = smaller file, lower quality.
[[variants]]
id    = "light"
label = { en = "Light", it = "Leggera" }
vars  = { crf = 23 }

[[variants]]
id      = "medium"
default = true
label   = { en = "Medium", it = "Media" }
vars    = { crf = 28 }

[[variants]]
id    = "strong"
label = { en = "Strong", it = "Forte" }
vars  = { crf = 32 }
