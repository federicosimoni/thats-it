# Shrink so the longest side is at most 1920 px (same format), using `sips`.
schema     = 1
id         = "image.max-1920"
category   = "images"
icon       = "arrow.down.right.and.arrow.up.left"
accepts    = [
  "public.png",
  "public.jpeg",
  "public.tiff",
  "public.heic",
  "public.heif",
  "com.microsoft.bmp",
  "com.compuserve.gif",
]
accepts_ext = ["png", "jpg", "jpeg", "tif", "tiff", "heic", "heif", "bmp", "gif"]
output_ext = "same"
output_suffix = " {size}px"
requires   = ["sips"]

[label]
en = "Resize to max size"
it = "Riduci a lato max"

[[steps]]
cmd = ["sips", "-Z", "{size}", "{input}", "--out", "{output}"]

# The id keeps its historical name so that Preferences settings survive.
[[variants]]
id    = "1280"
label = { en = "1280 px", it = "1280 px" }
vars  = { size = 1280 }

[[variants]]
id      = "1920"
default = true
label   = { en = "1920 px", it = "1920 px" }
vars    = { size = 1920 }

[[variants]]
id    = "3840"
label = { en = "3840 px (4K)", it = "3840 px (4K)" }
vars  = { size = 3840 }
