# Shrink so the longest side is at most N px (same format), with the pure-Rust image
# engine. Never enlarges: smaller images keep their size. HEIC: convert to JPG first.
# The id keeps its historical name so that Preferences settings survive.
schema     = 1
id         = "image.max-1920"
category   = "images"
icon       = "arrow.down.right.and.arrow.up.left"
accepts    = [
  "public.png",
  "public.jpeg",
  "public.tiff",
  "com.microsoft.bmp",
  "com.compuserve.gif",
  "org.webmproject.webp",
]
accepts_ext = ["png", "jpg", "jpeg", "tif", "tiff", "bmp", "gif", "webp"]
output_ext = "same"
output_suffix = " {size}px"

[label]
en = "Shrink to max size"
it = "Riduci a lato max"

[[steps]]
engine = "builtin:image"
args = { max_size = "{size}" }

[[variants]]
id    = "1280"
label = { en = "1280 px", it = "1280 px" }
vars  = { size = 1280 }

[[variants]]
id      = "1920"
default = true
label   = { en = "1920 px", it = "1920 px" }
vars    = { size = 1920 }

[[variants]]
id    = "3840"
label = { en = "3840 px (4K)", it = "3840 px (4K)" }
vars  = { size = 3840 }
