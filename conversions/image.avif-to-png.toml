# AVIF → PNG, using the built-in `sips` tool.
schema     = 1
id         = "image.avif-to-png"
category   = "images"
icon       = "photo"
accepts    = ["public.avif"]
accepts_ext = ["avif"]
output_ext = "png"
requires   = ["sips"]

[label]
en = "Convert to PNG"
it = "Converti in PNG"

[[steps]]
cmd = ["sips", "-s", "format", "png", "{input}", "--out", "{output}"]
