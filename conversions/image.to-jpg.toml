# Raster image → JPG, with the pure-Rust image engine.
schema     = 1
id         = "image.to-jpg"
category   = "images"
icon       = "photo"
accepts    = [
  "public.png",
  "public.tiff",
  "com.microsoft.bmp",
  "com.compuserve.gif",
  "org.webmproject.webp",
]
accepts_ext = ["png", "tif", "tiff", "bmp", "gif", "webp"]
output_ext = "jpg"

[label]
en = "Convert to JPG"
it = "Converti in JPG"

[[steps]]
engine = "builtin:image"
args = { format = "jpeg", quality = "{quality}" }

# Rest on "Convert to JPG" in the ring to choose the quality.
[[variants]]
id    = "high"
label = { en = "High quality", it = "Alta qualità" }
vars  = { quality = 95 }

[[variants]]
id      = "medium"
default = true
label   = { en = "Medium", it = "Media" }
vars    = { quality = 85 }

[[variants]]
id    = "small"
label = { en = "Small file", it = "File leggero" }
vars  = { quality = 70 }
